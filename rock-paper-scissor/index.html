<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissors
    </title>
    <link rel="stylesheet"
    href="styles/rock-paper.css">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <p class="title">
      Rock Paper Scissors<br>
    </p>
    <p class="js-score score" >

    </p>
    <div class="game">
      <div class="myMove">
        <p class="Player">
          Player
        </p>
        <p class="js-moves">
          
        </p>
        <button onclick="playGame('rock');" class="move-icon" >
          <img src="images/rock.png" class ="move" >
        </button>

        <button onclick="playGame('paper');"
        class="move-icon">
          <img src="images/paper.png" class ="move">
        </button>

        <button onclick="playGame('scissors');"
        class = "move-icon">
          <img src="images/scissors.png" class ="move">
        </button>

        <p class="js-result win-lose-tie">
            
        </p>

        <button onclick="
          score.wins = 0;
          score.losses = 0;
          score.ties = 0;
          localStorage.removeItem('score');
          updateScoreElement();"
          class="reset">
          <i class="fas fa-rotate-left"></i>
        </button>

      </div>
      <div class="myMove">
        <p class="Player">
          Computer
        </p>
        <p class="js-computer">
          
        </p>
      </div>
    </div>

    <script src="script/rock-paper.js">

    </script>
  </body>
</html>
